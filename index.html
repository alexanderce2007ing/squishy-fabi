<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Para Fabi 🌙</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =================================
         INTRO
    ================================== -->

    <section
        class="intro"
        id="intro"
    >

        <div class="intro-content">

            <p class="intro-small">
                una pequeña sorpresa...
            </p>

            <h1 id="greetingTitle">
                Hola, Fabi 👀
            </h1>

            <p
                class="intro-description"
                id="introDescription"
            >
                Hice una pequeña cosa para ti.
                <br>
                No es nada raro...
                <br>
                bueno, quizás un poquito.
            </p>

            <button id="startButton">
                Entrar 👀
            </button>

        </div>

    </section>


    <!-- =================================
         FONDO
    ================================== -->

    <div class="background">

        <div class="glow glow-one"></div>

        <div class="glow glow-two"></div>

        <div class="glow glow-three"></div>

        <div class="stars">

            <span>✦</span>
            <span>·</span>
            <span>✧</span>
            <span>·</span>
            <span>✦</span>
            <span>·</span>
            <span>✧</span>
            <span>·</span>
            <span>✦</span>
            <span>·</span>

        </div>

    </div>


    <!-- =================================
         GATOS
         EXACTAMENTE 3
    ================================== -->

    <div id="cats-container">


        <!-- GATO BLANCO -->

        <div
            class="persian-cat cat-white"
            id="catWhite"
        >

            <div class="cat-tail"></div>

            <div class="cat-body">

                <div class="cat-head">

                    <div class="ear ear-left"></div>

                    <div class="ear ear-right"></div>

                    <div class="cat-eye eye-left">
                        <span></span>
                    </div>

                    <div class="cat-eye eye-right">
                        <span></span>
                    </div>

                    <div class="cat-nose"></div>

                    <div class="cat-mouth"></div>

                    <div class="whisker w1"></div>
                    <div class="whisker w2"></div>
                    <div class="whisker w3"></div>

                    <div class="whisker w4"></div>
                    <div class="whisker w5"></div>
                    <div class="whisker w6"></div>

                </div>

            </div>

        </div>


        <!-- GATO NARANJA -->

        <div
            class="persian-cat cat-orange"
            id="catOrange"
        >

            <div class="cat-tail"></div>

            <div class="cat-body">

                <div class="cat-head">

                    <div class="ear ear-left"></div>

                    <div class="ear ear-right"></div>

                    <div class="cat-eye eye-left">
                        <span></span>
                    </div>

                    <div class="cat-eye eye-right">
                        <span></span>
                    </div>

                    <div class="cat-nose"></div>

                    <div class="cat-mouth"></div>

                    <div class="whisker w1"></div>
                    <div class="whisker w2"></div>
                    <div class="whisker w3"></div>

                    <div class="whisker w4"></div>
                    <div class="whisker w5"></div>
                    <div class="whisker w6"></div>

                </div>

            </div>

        </div>


        <!-- GATO NEGRO / PLOMO -->

        <div
            class="persian-cat cat-dark"
            id="catDark"
        >

            <div class="cat-tail"></div>

            <div class="cat-body">

                <div class="cat-head">

                    <div class="ear ear-left"></div>

                    <div class="ear ear-right"></div>

                    <div class="cat-eye eye-left">
                        <span></span>
                    </div>

                    <div class="cat-eye eye-right">
                        <span></span>
                    </div>

                    <div class="cat-nose"></div>

                    <div class="cat-mouth"></div>

                    <div class="whisker w1"></div>
                    <div class="whisker w2"></div>
                    <div class="whisker w3"></div>

                    <div class="whisker w4"></div>
                    <div class="whisker w5"></div>
                    <div class="whisker w6"></div>

                </div>

            </div>

        </div>

    </div>


    <!-- =================================
         EXPERIENCIA
    ================================== -->

    <main
        class="experience"
        id="experience"
    >

        <div class="progress-area">

            <span id="step">
                1 / 11
            </span>

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

        </div>


        <!-- CARTEL -->

        <div
            class="sign"
            id="sign"
        >

            <span id="message">
                Hola, Fabi 👀
            </span>

        </div>


        <!-- PERSONAJE -->

        <div
            class="character"
            id="character"
        >

            <div class="character-shadow"></div>

            <div class="arm arm-left"></div>

            <div class="arm arm-right"></div>


            <div class="squishy">

                <div class="face">

                    <div
                        class="eye"
                        id="eyeLeft"
                    ></div>

                    <div
                        class="eye"
                        id="eyeRight"
                    ></div>

                    <div
                        class="mouth"
                        id="mouth"
                    ></div>

                    <div class="cheek cheek-left"></div>

                    <div class="cheek cheek-right"></div>

                </div>

            </div>


            <div class="leg leg-left"></div>

            <div class="leg leg-right"></div>

        </div>


        <!-- BOTÓN -->

        <button
            class="interaction"
            id="interaction"
        >
            Tócame 👆
        </button>


        <p class="tiny-text">
            sí, tienes que tocarlo 😭
        </p>

    </main>


    <!-- PARTICULAS -->

    <div id="particles"></div>


    <script src="script.js"></script>

</body>

</html>
